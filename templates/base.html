<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="description" content="Sematlas">
    <meta name="author" content="Joseph Bakarji">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9" crossorigin="anonymous"> -->
    <script>
      // Set the theme before anything paints. Dark is the default; ?theme=light
      // wins for one visit, and an explicit choice is remembered after that.
      (function () {
        var p = new URLSearchParams(location.search).get("theme");
        var saved = null;
        try { saved = localStorage.getItem("sa-theme"); } catch (e) {}
        var theme = (p === "light" || p === "dark") ? p : (saved || "dark");
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="{{ url_for('static', filename='js/graph.js') }}"></script>
    <!-- <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-HwwvtgBNo3bZJJLYd8oVXjrBZt8cqVSpeBNS5n7C8IVInixGAoxmnlMuBnhbgrkm" crossorigin="anonymous"></script> -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>Sematlas: The semantic atlas of the world</title>
  </head>
  <body>
    {% block body %}
    {% endblock %}
  </body>
</html>
