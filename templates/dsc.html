{% extends 'base.html' %}

{% block body %}
<!-- Add D3.js -->
<script src="https://d3js.org/d3.v7.min.js"></script>

<!-- Add script.js before dsc.js -->
<script src="{{ url_for('static', filename='js/script.js') }}"></script>

<div class="sidebar" id="mySidebar">
    <a class="closebtn" href="javascript:void(0)" onclick="shrinkSearchBox()"><</a>
    <div class="header-container">
        <div class="input-container">
            <p class="feature-title">DSC Visualization</p>
            
            <!-- Add file upload section -->
            <div class="upload-section" style="margin-top: 20px; padding: 15px;">
                <p style="margin-bottom: 10px;">Upload custom DSC file:</p>
                <input type="file" id="fileInput" accept=".txt,.json" style="margin-bottom: 10px;">
                <button onclick="handleFileUpload()" class="upload-btn">Upload</button>
            </div>
            
            <!-- Add reset button -->
            <div style="margin-top: 10px; padding: 15px;">
                <button onclick="resetToDefault()" class="reset-btn">Reset to Default</button>
            </div>
        </div>
    </div>
</div>

<div id="main">
    <header>
        <div class="wordmap-title">SemAtlas DSC</div>
    </header>

    <div id="loading-spinner" style="display: none;">
        <div class="spinner"></div>
    </div>

    <svg id="visualization"></svg>
</div>

<!-- Pass initial data to JavaScript -->
<script>
    {% if initial_data %}
        window.initialData = {{ initial_data|tojson|safe }};
        // Store default data for reset functionality
        window.defaultData = JSON.parse(JSON.stringify(window.initialData));
    {% endif %}
    
    {% if error %}
        console.error("Error:", {{ error|tojson|safe }});
        alert("Error loading data: " + {{ error|tojson|safe }});
    {% endif %}
</script>

<!-- Load visualization script -->
<script src="{{ url_for('static', filename='js/dsc.js') }}"></script>

<!-- Add some basic styles -->
<style>
    .upload-btn, .reset-btn {
        padding: 8px 15px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
        transition: background-color 0.3s;
    }
    
    .upload-btn {
        background-color: #4CAF50;
        color: white;
    }
    
    .upload-btn:hover {
        background-color: #45a049;
    }
    
    .reset-btn {
        background-color: #f8f9fa;
        color: #333;
        border: 1px solid #ddd;
    }
    
    .reset-btn:hover {
        background-color: #e9ecef;
    }
    
    #loading-spinner {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 1000;
    }
</style>
{% endblock %}
