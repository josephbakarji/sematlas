<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Wikipedia Scraper Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        h1 {
            color: #333;
        }
        .search-box {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        input {
            padding: 10px;
            font-size: 16px;
            width: 300px;
            margin-right: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #1976D2;
        }
        #output {
            background: white;
            padding: 20px;
            border-radius: 8px;
            font-family: monospace;
            white-space: pre-wrap;
        }
        .success {
            color: green;
        }
        .error {
            color: red;
        }
        .info {
            color: blue;
        }
        .link-item {
            padding: 5px;
            margin: 2px 0;
            background: #f9f9f9;
            border-left: 3px solid #2196F3;
            padding-left: 10px;
        }
        .stats {
            background: #e3f2fd;
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>🔍 Simple Wikipedia Scraper Test</h1>

    <div class="search-box">
        <input type="text" id="query" value="Philosophy" placeholder="Enter Wikipedia topic">
        <button onclick="testScrape()">Scrape Wikipedia</button>
    </div>

    <div id="output">Enter a topic and click "Scrape Wikipedia" to see what links are found...</div>

    <script>
        async function testScrape() {
            const query = document.getElementById('query').value.trim();
            const output = document.getElementById('output');

            if (!query) {
                output.innerHTML = '<span class="error">❌ Please enter a topic</span>';
                return;
            }

            output.innerHTML = '<span class="info">⏳ Scraping Wikipedia...</span>';

            try {
                const response = await fetch(`/simple_scrape?q=${encodeURIComponent(query)}`);
                const data = await response.json();

                if (data.error) {
                    output.innerHTML = `<span class="error">❌ Error: ${data.error}</span>\n${data.details || ''}`;
                    return;
                }

                // Build output
                let html = `<span class="success">✅ Successfully scraped Wikipedia!</span>\n\n`;
                html += `<div class="stats">📊 STATS</div>\n`;
                html += `Query: "${data.query}"\n`;
                html += `Found article: "${data.title}"\n`;
                html += `URL: ${data.url}\n`;
                html += `Total links found: ${data.links_count}\n`;
                html += `\n<div class="stats">🔗 LINKS (first 50)</div>\n`;

                const linksToShow = data.links.slice(0, 50);
                linksToShow.forEach((link, index) => {
                    html += `<div class="link-item">${index + 1}. ${link.title}</div>\n`;
                });

                if (data.links.length > 50) {
                    html += `\n<span class="info">... and ${data.links.length - 50} more links</span>\n`;
                }

                output.innerHTML = html;

            } catch (error) {
                output.innerHTML = `<span class="error">❌ Error: ${error.message}</span>`;
            }
        }

        // Auto-run on load
        window.onload = () => {
            testScrape();
        };
    </script>
</body>
</html>
